[package]
name = "wifi-densepose-calibration"
version.workspace = true
edition.workspace = true
description = "ADR-151 per-room calibration & specialized model training (baseline → enroll → extract → train)"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wifi-densepose-core = { workspace = true }
wifi-densepose-signal = { version = "0.3.0", path = "../wifi-densepose-signal", default-features = false }

serde = { workspace = true }
serde_json = "1.0"
thiserror = { workspace = true }
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
ndarray = { workspace = true }
num-complex = { workspace = true }
criterion = { workspace = true }

# ADR-151: per-window calibration hot-path benchmarks (mixture inference +
# feature extraction). Runnable on a Pi 5 (aarch64) to validate the
# "specialists run in microseconds on a Pi CPU" claim.
[[bench]]
name = "specialist_bench"
harness = false
