## ESP-IDF Managed Component Dependencies (ADR-045)
dependencies:
  ## LVGL graphics library
  lvgl/lvgl: "~8.3"

  ## CST816S capacitive touch driver
  espressif/esp_lcd_touch_cst816s: "^1.0"

  ## LCD touch abstraction
  espressif/esp_lcd_touch: "^1.0"

  ## Onboard WS2812 LED Disabling
  espressif/led_strip: "^3.0.0"

  ## Receiver gain control for the optional CSI gain lock (CONFIG_CSI_GAIN_LOCK).
  ## Prebuilt, Apache-2.0, ESP32-S3 only; unused code is not linked when the
  ## option is off.
  espressif/esp_csi_gain_ctrl:
    version: ">=0.1.4"
    rules:
      - if: "target == esp32s3"
